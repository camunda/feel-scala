name: publish-docs

on:
  push:
    branches: [main]

env:
  GITHUB_TOKEN: ${{ secrets.GH_TOKEN }}
  GIT_USERNAME: camunda-bot
  REPO: ${{ github.repository }}

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - name: Publish
        run: |
          # Configure git client
          echo "Git repo - $REPO"
          echo "Git user - $GIT_USERNAME"
          git config --global user.email "$GIT_USERNAME@users.noreply.github.com"
          git config --global user.name "$GIT_USERNAME"
          echo "machine github.com login $GIT_USERNAME password $GITHUB_TOKEN" > ~/.netrc
          # Copy static site to a temp directory and push to gh-pages
          TMP_DIR=$(mktemp -d)
          cp -r docs/. "$TMP_DIR/"
          cd "$TMP_DIR"
          git init
          git checkout -b gh-pages
          git add -A
          git commit -m "Update static site"
          git push --force "https://github.com/$REPO.git" gh-pages
